# wavCSE-TSM Configuration
# Task Structure Matrix (Ciliberto et al. 2015)

log_level: INFO

device:
  type: cuda
  index: 0

paths:
  root_data_path: ~/voice_dataset
  root_emb_path: ~/embedding
  results_root: results_tsm
  checkpoints_root: checkpoints_tsm

upstream:
  model_type: wavlm_large
  selected_transformer_layers: 6,1,0,3,2,5,4,7,8,9,10,11,12,17,14,13

dataset:
  subset_percentage: 100
  ignore_index: -1

pooling:
  frame_pooling_type: mean
  frame_pooling_param: null
  layer_pooling_type: weighted
  layer_pooling_param: null

model:
  embedding_dim_shared1: 512
  embedding_dim_shared2: 2000
  dropout_prob_shared1: 0.4
  dropout_prob_shared2: 0.6
  # TSM-specific
  num_latent_classifiers: 8
  structure_sparsity_lambda: 0.01

training:
  num_epochs: 100
  batch_size: 2048
  learning_rate: 0.0025
  weight_decay: 0.00000005
  saved_checkpoint_count: 3
  shuffle_train: true
  shuffle_val: false
  pin_memory: false
  drop_last_train: true
  drop_last_val: false
  num_workers: 0
  patience: 5
  factor: 0.5
  l1_lambda: 0.0000001
  l2_lambda: 0.00001

# TSM alternating minimization
tsm:
  alternate_frequency: 5
  structure_epochs: 1
  structure_lr: 0.001

evaluation:
  batch_size: 2048
  shuffle: false
  pin_memory: false
  drop_last: false
  num_workers: 0
